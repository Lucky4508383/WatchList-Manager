<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Universal Watchlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #00f0ff;
            --primary-hover: #00c3ff;
            --primary-glow: rgba(0, 240, 255, 0.6);
            --bg-body: #05050a;
            --bg-glass: rgba(10, 10, 15, 0.8);
            --bg-glass-hover: rgba(15, 15, 25, 0.9);
            --border-glass: rgba(0, 240, 255, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Glassmorphism Navbar */
        .navbar {
            background: rgba(9, 9, 11, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            padding: 0 40px;
            display: flex;
            align-items: center;
            height: 70px;
            gap: 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand::before {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: var(--primary);
            border-radius: 6px;
            mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 22h20L12 2z"/></svg>') center/contain no-repeat;
            -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L1 21h22L12 3z"/></svg>') center/contain no-repeat;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            height: 100%;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            position: relative;
            transition: color 0.3s ease;
            letter-spacing: 0.3px;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: var(--primary);
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        .nav-link.active {
            color: white;
            font-weight: 600;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 50px 20px;
            transition: max-width 0.3s ease, padding 0.3s ease;
        }

        .container.expanded-mode {
            max-width: 100%;
            padding: 20px 40px;
            min-height: calc(100vh - 70px);
        }

        /* Top Back Bar for Expanded Mode */
        .back-bar {
            display: none;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 30px;
            width: 100%;
        }

        .back-bar.active {
            display: flex;
        }

        .back-btn-global {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 2px;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .back-btn-global:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }



        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 50px;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Global Header */
        .page-header {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .export-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 10px 20px;
            border-radius: 2px;
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .export-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .export-btn:active {
            transform: translateY(1px);
        }

        /* Stats Chart Container */
        .stats-container {
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid var(--border-glass);
            border-radius: 4px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .stats-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
        }

        /* Dashboard Rows */
        .category-row {
            margin-bottom: 50px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .category-header h3 {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }

        .category-header h3::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background-color: var(--primary);
            margin-right: 12px;
            border-radius: 2px;
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .expand-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: auto;
            font-family: inherit;
        }

        .expand-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .count-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glass);
            color: white;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            padding: 2px 10px;
            border-radius: 2px;
            font-weight: 400;
        }

        /* Results Grid */
        .poster-grid {
            display: flex;
            overflow-x: auto;
            gap: 25px;
            padding-bottom: 20px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
            min-height: 250px;
        }

        .poster-grid::-webkit-scrollbar {
            height: 8px;
        }

        .poster-grid::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .poster-grid.extended {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            overflow-x: visible;
        }

        .poster-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
            width: 180px;
            flex-shrink: 0;
        }

        @media (min-width: 1200px) {
            .poster-card {
                width: 210px;
            }
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 4px;
            overflow: hidden;
            background-color: rgba(10, 10, 15, 0.5);
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transform-origin: center bottom;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .poster-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s ease;
        }

        /* Glassmorphic overlay */
        .poster-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 50%, rgba(0, 0, 0, 0.3) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: stretch;
            padding: 20px 15px;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .poster-wrapper:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .poster-wrapper:hover .poster-overlay {
            opacity: 1;
        }

        .poster-wrapper:hover .poster-image {
            transform: scale(1.08);
            filter: brightness(0.6);
        }

        .overlay-select {
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 10px 12px;
            border-radius: 2px;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            width: 100%;
            background: rgba(30, 30, 35, 0.95);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 10px top 50%;
            background-size: 10px auto;
            transition: all 0.2s;
        }

        .overlay-select option {
            background: #111;
        }

        .overlay-select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .platform-tag {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 4px 10px;
            border-radius: 2px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            font-weight: 400;
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            z-index: 2;
        }

        .new-season-inline {
            background: var(--primary);
            color: #05050a;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 0.65rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 8px;
            vertical-align: middle;
            animation: pulse-badge 2s infinite;
            display: inline-block;
        }

        @keyframes pulse-badge {
            0% {
                transform: scale(1);
                box-shadow: 0 0 10px var(--primary-glow);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 20px var(--primary-glow);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 10px var(--primary-glow);
            }
        }

        .delete-btn-wide {
            background: rgba(255, 0, 60, 0.1);
            color: #ff003c;
            border: 1px solid rgba(255, 0, 60, 0.4);
            padding: 10px 12px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 400;
            width: 100%;
            margin-top: 4px;
        }

        .delete-btn-wide:hover {
            background: rgba(255, 77, 79, 0.25);
            border-color: #ff4d4f;
            transform: translateY(-1px);
        }

        .delete-btn-wide:active {
            transform: translateY(1px);
        }

        .fav-icon-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(20, 20, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s ease;
        }

        .fav-icon-btn:hover {
            background: rgba(255, 0, 127, 0.2);
            border-color: #ff007f;
            transform: scale(1.1);
        }

        .fav-icon-btn.active {
            color: #ff007f;
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }

        .fav-icon-btn svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s;
            fill: none;
        }

        .fav-icon-btn.active svg {
            fill: #ff007f;
            stroke: #ff007f;
            transform: scale(1.1);
        }

        .poster-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0 4px;
        }

        .poster-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: white;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .poster-year {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
            background: rgba(20, 20, 25, 0.9);
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            min-height: 150px;
            justify-content: center;
        }

        .empty-state::before {
            content: '📋';
            font-size: 2.5rem;
            opacity: 0.5;
            display: block;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0;
                transform: scale(0.9);
            }
        }

        .platform-filters {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-glass);
            -webkit-overflow-scrolling: touch;
        }

        .platform-filters::-webkit-scrollbar {
            height: 6px;
        }

        .platform-filters::-webkit-scrollbar-track {
            background: var(--bg-glass);
            border-radius: 10px;
        }

        .platform-filters::-webkit-scrollbar-thumb {
            background-color: var(--primary);
            border-radius: 10px;
        }

        .filter-pill {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .filter-pill:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .filter-pill.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 0 20px;
                height: 60px;
            }

            .nav-links {
                display: none;
            }

            .poster-card {
                width: 150px;
            }

            .poster-grid {
                gap: 15px;
            }

            .header-section {
                flex-direction: column;
                align-items: stretch;
            }

            .page-header {
                font-size: 2rem;
            }

            .stats-container {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="brand">Watchlist</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Search</a>
            <a href="watchlist.html" class="nav-link active">Dashboard</a>
            <a href="history.html" class="nav-link">History</a>
            <a href="login.html" class="nav-link" id="authLink">Sign In</a>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <div style="display: flex; flex-direction: column; gap: 15px; align-items: flex-start;">
                <h2 class="page-header">My Dashboard</h2>
                <button id="exportDataBtn" class="export-btn" onclick="window.exportUserData()" title="Download your watchlist and favorites data">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Export Data
                </button>
            </div>
            <div class="stats-container">
                <div class="stats-title">Progress Overview</div>
                <div class="chart-wrapper">
                    <canvas id="progressChart"></canvas>
                </div>
                <div id="statsList"
                    style="margin-top: 20px; width: 100%; display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </div>

        <div class="platform-filters" id="platformFilters">
            <button class="filter-pill active" data-platform="All">All Platforms</button>
            <button class="filter-pill" data-platform="Netflix">Netflix</button>
            <button class="filter-pill" data-platform="Prime Video">Prime Video</button>
            <button class="filter-pill" data-platform="Disney+">Disney+</button>
            <button class="filter-pill" data-platform="Crunchyroll">Crunchyroll</button>
            <button class="filter-pill" data-platform="Rakuten Viki">Rakuten Viki</button>
            <button class="filter-pill" data-platform="Other">Other</button>
        </div>

        <div class="platform-filters" id="typeFilters" style="margin-top: -20px; margin-bottom: 50px;">
            <button class="filter-pill active" data-type="All">Movies & Series</button>
            <button class="filter-pill" data-type="movie">Movies Only</button>
            <button class="filter-pill" data-type="tv">Series Only</button>
        </div>

        <div class="category-row">
            <div class="category-header">
                <h3 style="color: #ff3366;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                    Favorites
                </h3>
                <span class="count-badge" id="count-favorites"
                    style="border-color: rgba(255, 51, 102, 0.3); color: #ff3366; background: rgba(255, 51, 102, 0.1);">0</span>
            </div>
            <div class="poster-grid" id="list-favorites">
                <div class="empty-state">No favorites yet</div>
            </div>
        </div>

        <div class="category-row">
            <div class="category-header">
                <h3 style="color: #eab308;">Watching New</h3>
                <span class="count-badge" id="count-Watching"
                    style="border-color: rgba(234, 179, 8, 0.3); color: #eab308; background: rgba(234, 179, 8, 0.1);">0</span>
            </div>
            <div class="poster-grid" id="list-Watching">
                <div class="empty-state">No items yet</div>
            </div>
        </div>

        <div class="category-row">
            <div class="category-header">
                <h3 style="color: #fb923c;">Watching Another S/M</h3>
                <span class="count-badge" id="count-watching-another"
                    style="border-color: rgba(251, 146, 60, 0.3); color: #fb923c; background: rgba(251, 146, 60, 0.1);">0</span>
            </div>
            <div class="poster-grid" id="list-watching-another">
                <div class="empty-state">No items yet</div>
            </div>
        </div>

        <div class="category-row">
            <div class="category-header">
                <h3 style="color: #ef4444;">Plan to Watch</h3>
                <span class="count-badge" id="count-plan-to-watch"
                    style="border-color: rgba(239, 68, 68, 0.3); color: #ef4444; background: rgba(239, 68, 68, 0.1);">0</span>
            </div>
            <div class="poster-grid" id="list-plan-to-watch">
                <div class="empty-state">No items yet</div>
            </div>
        </div>

        <div class="category-row">
            <div class="category-header">
                <h3 style="color: #6b7280;">On Hold</h3>
                <span class="count-badge" id="count-on-hold"
                    style="border-color: rgba(107, 114, 128, 0.3); color: #6b7280; background: rgba(107, 114, 128, 0.1);">0</span>
            </div>
            <div class="poster-grid" id="list-on-hold">
                <div class="empty-state">No items yet</div>
            </div>
        </div>

        <div class="category-row">
            <div class="category-header">
                <h3 style="color: #22c55e;">Watched</h3>
                <span class="count-badge" id="count-watched"
                    style="border-color: rgba(34, 197, 94, 0.3); color: #22c55e; background: rgba(34, 197, 94, 0.1);">0</span>
            </div>
            <div class="poster-grid" id="list-watched">
                <div class="empty-state">No items yet</div>
            </div>

    <script type="module">
        import { auth, db, onAuthStateChanged, signOut, doc, setDoc, getDoc } from './firebase-config.js';

        let progressChart = null;
        let currentUser = null;
        let windowUserWatchlist = [];
        let windowUserFavorites = [];
        let windowUserHistory = [];
        let currentPlatformFilter = sessionStorage.getItem('dashboard_platform') || 'All';
        let currentTypeFilter = sessionStorage.getItem('dashboard_type') || 'All';
        let currentExpandedRow = null;

        // Try to load cached data immediately to prevent full refresh UI flicker on back
        const cachedData = sessionStorage.getItem('dashboard_data');
        if (cachedData) {
            try {
                const parsed = JSON.parse(cachedData);
                windowUserWatchlist = parsed.watchlist || [];
                windowUserFavorites = parsed.favorites || [];
                windowUserHistory = parsed.history || [];
            } catch (e) {}
        }

        onAuthStateChanged(auth, async (user) => {
            const authLink = document.getElementById('authLink');
            if (user) {
                currentUser = user;
                authLink.textContent = "Logout";
                authLink.href = "#";
                authLink.onclick = (e) => {
                    e.preventDefault();
                    signOut(auth).then(() => {
                        window.location.href = "login.html";
                    });
                };

                // Render cached data immediately if available
                if (windowUserWatchlist.length > 0 || windowUserFavorites.length > 0) {
                    refreshDashboard(true); // pass true to indicate it's from cache
                }

                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        let changed = false;
                        
                        // Simple check to avoid re-rendering if identical (prevents flicker)
                        const newDataStr = JSON.stringify({w: data.watchlist, f: data.favorites});
                        const oldDataStr = JSON.stringify({w: windowUserWatchlist, f: windowUserFavorites});
                        
                        if (newDataStr !== oldDataStr) {
                            if (data.watchlist) windowUserWatchlist = data.watchlist;
                            if (data.favorites) windowUserFavorites = data.favorites;
                            if (data.history) windowUserHistory = data.history;
                            sessionStorage.setItem('dashboard_data', JSON.stringify({
                                watchlist: windowUserWatchlist,
                                favorites: windowUserFavorites,
                                history: windowUserHistory
                            }));
                            refreshDashboard();
                        }
                    }
                } catch (e) {
                    console.error("Error fetching watchlist", e);
                }
            } else {
                window.location.href = "login.html";
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (windowUserWatchlist.length > 0 || windowUserFavorites.length > 0) {
                 refreshDashboard(true);
            } else {
                 updateCounts();
            }

            const platformPills = document.querySelectorAll('#platformFilters .filter-pill');
            platformPills.forEach(pill => {
                if (pill.dataset.platform === currentPlatformFilter) {
                    platformPills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                }
                pill.addEventListener('click', (e) => {
                    platformPills.forEach(p => p.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentPlatformFilter = target.dataset.platform;
                    sessionStorage.setItem('dashboard_platform', currentPlatformFilter);
                    refreshDashboard();
                });
            });

            const typePills = document.querySelectorAll('#typeFilters .filter-pill');
            typePills.forEach(pill => {
                if (pill.dataset.type === currentTypeFilter) {
                    typePills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                }
                pill.addEventListener('click', (e) => {
                    typePills.forEach(p => p.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentTypeFilter = target.dataset.type;
                    sessionStorage.setItem('dashboard_type', currentTypeFilter);
                    refreshDashboard();
                });
            });

            const categoryHeaders = document.querySelectorAll('.category-header');
            categoryHeaders.forEach(header => {
                const expandBtn = document.createElement('button');
                expandBtn.className = 'expand-btn';
                expandBtn.innerText = 'Show All';
                header.appendChild(expandBtn);

                expandBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const currentRow = header.closest('.category-row');
                    const grid = currentRow.querySelector('.poster-grid');
                    const isExpanding = !grid.classList.contains('extended');

                    if (isExpanding) {
                        grid.classList.add('extended');
                        document.querySelector('.container').classList.add('expanded-mode');

                        expandBtn.innerHTML = '<span style="font-size: 1.1em; margin-right: 4px;">&larr;</span> Back';
                        expandBtn.style.background = 'var(--primary)';
                        expandBtn.style.borderColor = 'var(--primary)';

                        currentExpandedRow = currentRow;

                        // Hide everything else except filters
                        document.querySelectorAll('.category-row').forEach(row => {
                            if (row !== currentRow) row.style.display = 'none';
                        });
                        const topHeader = document.querySelector('.header-section');
                        if (topHeader) topHeader.style.display = 'none';

                        // Scroll to top
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        grid.classList.remove('extended');
                        document.querySelector('.container').classList.remove('expanded-mode');

                        expandBtn.innerText = 'Show All';
                        expandBtn.style.background = '';
                        expandBtn.style.borderColor = '';

                        currentExpandedRow = null;

                        // Restore everything
                        document.querySelectorAll('.category-row').forEach(row => {
                            row.style.display = 'block';
                        });
                        const topHeader = document.querySelector('.header-section');
                        if (topHeader) topHeader.style.display = 'flex';

                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            });
        });

        function initChart(counts, labels) {
            const ctx = document.getElementById('progressChart').getContext('2d');

            progressChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels || ['Watching New: 0', 'Watching Another: 0', 'Plan to Watch: 0', 'On Hold: 0', 'Watched: 0'],
                    datasets: [{
                        data: counts,
                        backgroundColor: [
                            '#eab308', // Yellow for Watching
                            '#fb923c', // Orange for Watching Another
                            '#ef4444', // Red for Plan to watch
                            '#6b7280', // Grey for On Hold
                            '#22c55e'  // Green for Watched
                        ],
                        borderColor: '#09090b',
                        borderWidth: 4,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: 10
                    },
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#e2e8f0',
                                font: { family: 'Inter', size: 12 },
                                boxWidth: 12,
                                padding: 15,
                                generateLabels: function (chart) {
                                    const data = chart.data;
                                    if (data.labels.length && data.datasets.length) {
                                        const originalLabels = Chart.defaults.plugins.legend.labels.generateLabels(chart);
                                        const sum = data.datasets[0].data.reduce((a, b) => a + b, 0);
                                        originalLabels.push({
                                            text: `Grand Total: ${sum}`,
                                            fillStyle: 'transparent',
                                            strokeStyle: 'transparent',
                                            lineWidth: 0,
                                            hidden: false,
                                            index: 99
                                        });
                                        return originalLabels;
                                    }
                                    return [];
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            titleFont: { family: 'Inter' },
                            bodyFont: { family: 'Inter', size: 13 },
                            padding: 12,
                            cornerRadius: 8,
                            displayColors: true,
                            callbacks: {
                                label: function (context) {
                                    const baseLabel = context.label.split(':')[0];
                                    return ` ${baseLabel}: ${context.raw}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateChart(counts) {
            const total = counts.reduce((a, b) => a + b, 0);
            const dataCounts = total === 0 ? [0, 0, 0, 0, 0] : counts;
            const updatedLabels = [
                `Watching New: ${dataCounts[0]}`,
                `Watching Another: ${dataCounts[1]}`,
                `Plan to Watch: ${dataCounts[2]}`,
                `On Hold: ${dataCounts[3]}`,
                `Watched: ${dataCounts[4]}`
            ];

            if (progressChart) {
                progressChart.data.datasets[0].data = dataCounts;
                progressChart.data.labels = updatedLabels;
                progressChart.update();
            } else {
                initChart(dataCounts, updatedLabels);
            }

            const statsList = document.getElementById('statsList');
            if (statsList) {
                statsList.innerHTML = `
                    <div style="display: flex; justify-content: space-between; font-size: 0.95rem;"><span style="color: #eab308; font-weight: 600;">Watching New:</span> <span>${dataCounts[0]}</span></div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.95rem;"><span style="color: #fb923c; font-weight: 600;">Watching Another S/M:</span> <span>${dataCounts[1]}</span></div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.95rem;"><span style="color: #ef4444; font-weight: 600;">Plan to Watch:</span> <span>${dataCounts[2]}</span></div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.95rem;"><span style="color: #6b7280; font-weight: 600;">On Hold:</span> <span>${dataCounts[3]}</span></div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.95rem;"><span style="color: #22c55e; font-weight: 600;">Watched:</span> <span>${dataCounts[4]}</span></div>
                    <div style="display: flex; justify-content: space-between; font-size: 1.05rem; margin-top: 5px; border-top: 1px solid var(--border-glass); padding-top: 10px; font-weight: 700;"><span>Total Titles:</span> <span>${total}</span></div>
                `;
            }
        }

        function renderItem(item) {
            let statusListId = `list-${item.status}`;
            if (item.status === 'watching') statusListId = 'list-Watching';

            const listContainer = document.getElementById(statusListId);

            const emptyState = listContainer.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const card = document.createElement('div');
            card.className = 'poster-card';
            card.setAttribute('data-id', item.id);

            const yearHtml = item.year ? item.year : 'N/A';
            const imageSrc = item.image || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMWIxZDIyIiBzdHJva2Utd2lkdGg9IjIiPjxyZWN0IHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgcng9IjQiLz48cGF0aCBkPSJNMTAgMjBsMTAgMTAiLz48cGF0aCBkPSJNMjAgMjBMMTAgMzAiLz48L3N2Zz4=';
            const cleanTitle = item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            const onClickHtml = (item.tmdbId && item.mediaType) ? `onclick="window.location.href='details.html?id=${item.tmdbId}&type=${item.mediaType}'" style="cursor: pointer;"` : '';
            const isFav = windowUserFavorites.some(f => f.title === item.title && f.year == item.year);

            card.innerHTML = `
            <div class="poster-wrapper" ${onClickHtml}>
                <img src="${imageSrc}" class="poster-image" alt="${cleanTitle}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMWIxZDIyIiBzdHJva2Utd2lkdGg9IjIiPjxyZWN0IHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgcng9IjQiLz48cGF0aCBkPSJNMTAgMjBsMTAgMTAiLz48cGF0aCBkPSJNMjAgMjBMMTAgMzAiLz48L3N2Zz4='">
                <div class="platform-tag">${item.platform}</div>
                <div class="fav-icon-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); window.toggleFavoriteWL('${item.id}', this)" title="Toggle Favorite">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </div>
                <div class="poster-overlay">
                    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
                        <select class="overlay-select" onchange="event.stopPropagation(); window.updateItem(${item.id}, 'platform', this.value)" onclick="event.stopPropagation()">
                            <option value="Netflix" ${item.platform === 'Netflix' ? 'selected' : ''}>Netflix</option>
                            <option value="Prime Video" ${item.platform === 'Prime Video' ? 'selected' : ''}>Prime Video</option>
                            <option value="Disney+" ${item.platform === 'Disney+' ? 'selected' : ''}>Disney+</option>
                            <option value="Crunchyroll" ${item.platform === 'Crunchyroll' ? 'selected' : ''}>Crunchyroll</option>
                            <option value="Rakuten Viki" ${item.platform === 'Rakuten Viki' ? 'selected' : ''}>Rakuten Viki</option>
                            <option value="Other" ${item.platform === 'Other' ? 'selected' : ''}>Other</option>
                        </select>
                        <select class="overlay-select" onchange="event.stopPropagation(); window.updateItem(${item.id}, 'status', this.value)" onclick="event.stopPropagation()">
                            <option value="Watching" ${item.status === 'Watching' ? 'selected' : ''}>Watching New</option>
                            <option value="watching-another" ${item.status === 'watching-another' ? 'selected' : ''}>Watching Another S/M</option>
                            <option value="plan-to-watch" ${item.status === 'plan-to-watch' ? 'selected' : ''}>Plan to watch</option>
                            <option value="on-hold" ${item.status === 'on-hold' ? 'selected' : ''}>On Hold</option>
                            <option value="watched" ${item.status === 'watched' ? 'selected' : ''}>Watched</option>
                        </select>
                        <button class="delete-btn-wide" onclick="event.stopPropagation(); window.deleteItem(${item.id})" title="Remove from Watchlist">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                            Remove
                        </button>
                    </div>
                </div>
            </div>
            <div class="poster-info">
                <div class="poster-title" ${onClickHtml}>${item.title}</div>
                <div class="poster-year">${yearHtml}</div>
            </div>
            `;
            listContainer.appendChild(card);

            if (item.mediaType === 'tv') {
                checkNewSeason(item, card);
            }
        }

        function renderFavoriteItem(item) {
            const listContainer = document.getElementById('list-favorites');
            if (!listContainer) return;

            const emptyState = listContainer.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const card = document.createElement('div');
            card.className = 'poster-card';
            card.setAttribute('data-favid', item.id);

            const yearHtml = item.year ? item.year : 'N/A';
            const imageSrc = item.image || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMWIxZDIyIiBzdHJva2Utd2lkdGg9IjIiPjxyZWN0IHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgcng9IjQiLz48cGF0aCBkPSJNMTAgMjBsMTAgMTAiLz48cGF0aCBkPSJNMjAgMjBMMTAgMzAiLz48L3N2Zz4=';
            const cleanTitle = item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            const onClickHtml = (item.tmdbId && item.mediaType) ? `onclick="window.location.href='details.html?id=${item.tmdbId}&type=${item.mediaType}'" style="cursor: pointer;"` : '';

            card.innerHTML = `
            <div class="poster-wrapper" ${onClickHtml}>
                <img src="${imageSrc}" class="poster-image" alt="${cleanTitle}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMWIxZDIyIiBzdHJva2Utd2lkdGg9IjIiPjxyZWN0IHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgcng9IjQiLz48cGF0aCBkPSJNMTAgMjBsMTAgMTAiLz48cGF0aCBkPSJNMjAgMjBMMTAgMzAiLz48L3N2Zz4='">
                <div class="poster-overlay">
                    <div style="width: 100%; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 8px;">
                        <button class="delete-btn-wide" onclick="event.stopPropagation(); window.deleteFavoriteItem(${item.id})" title="Remove from Favorites" style="background: rgba(255, 51, 102, 0.1); color: #ff3366; border-color: rgba(255, 51, 102, 0.4);">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            Unfavorite
                        </button>
                    </div>
                </div>
            </div>
            <div class="poster-info">
                <div class="poster-title" ${onClickHtml}>${item.title}</div>
                <div class="poster-year">${yearHtml}</div>
            </div>
            `;
            listContainer.appendChild(card);

            if (item.mediaType === 'tv') {
                checkNewSeason(item, card);
            }
        }

        function loadData() {
            let filteredWatchlist = windowUserWatchlist;
            if (currentPlatformFilter !== 'All') {
                filteredWatchlist = filteredWatchlist.filter(item => item.platform === currentPlatformFilter);
            }
            if (currentTypeFilter !== 'All') {
                filteredWatchlist = filteredWatchlist.filter(item => item.mediaType === currentTypeFilter);
            }
            filteredWatchlist.sort((a, b) => b.id - a.id);
            filteredWatchlist.forEach(item => renderItem(item));

            let filteredFavorites = windowUserFavorites;
            if (currentTypeFilter !== 'All') {
                filteredFavorites = filteredFavorites.filter(item => item.mediaType === currentTypeFilter);
            }
            filteredFavorites.sort((a, b) => b.id - a.id);
            filteredFavorites.forEach(item => renderFavoriteItem(item));

            updateCounts();
        }

        async function checkNewSeason(item, cardElement) {
            if (!item.tmdbId) return;
            try {
                const response = await fetch(`https://api.themoviedb.org/3/tv/${item.tmdbId}?api_key=15d2ea6d0dc1d476efbca3eba2b9bbfb`);
                if (!response.ok) return;
                const data = await response.json();

                let hasNewSeason = false;

                // Check seasons array for recent/upcoming season
                if (data.seasons && data.seasons.length > 0) {
                    const latestSeason = data.seasons[data.seasons.length - 1];
                    // Only show 'NEW SEASON' if it's season 2 or later (season_number > 1)
                    if (latestSeason.season_number > 1 && latestSeason.air_date) {
                        const airDate = new Date(latestSeason.air_date);
                        const now = new Date();
                        const diffDays = Math.ceil((now - airDate) / (1000 * 60 * 60 * 24));

                        // If it aired in the last 45 days, or is airing in the next 30 days
                        if (diffDays >= -30 && diffDays <= 45) {
                            hasNewSeason = true;
                        }
                    }
                }

                if (hasNewSeason) {
                    const posterInfo = cardElement.querySelector('.poster-info');
                    if (posterInfo && !posterInfo.querySelector('.new-season-inline')) {
                        const yearEl = posterInfo.querySelector('.poster-year');
                        if (yearEl) {
                            const badge = document.createElement('span');
                            badge.className = 'new-season-inline';
                            badge.innerText = 'NEW SEASON';
                            yearEl.appendChild(badge);
                        }
                    }
                }
            } catch (e) {
                console.error("Error checking new season for", item.title, e);
            }
        }

        function updateCounts() {
            const counts = [];
            ['Watching', 'watching-another', 'plan-to-watch', 'on-hold', 'watched'].forEach(status => {
                const listId = `list-${status}`;
                const countId = `count-${status}`;
                const container = document.getElementById(listId);
                const counter = document.getElementById(countId);

                if (container && counter) {
                    const itemCount = container.querySelectorAll('.poster-card').length;
                    counter.innerText = itemCount;
                    counts.push(itemCount);
                } else {
                    counts.push(0);
                }
            });

            // Favorites count
            const favContainer = document.getElementById('list-favorites');
            const favCounter = document.getElementById('count-favorites');
            if (favContainer && favCounter) {
                favCounter.innerText = favContainer.querySelectorAll('.poster-card').length;
            }

            updateChart(counts);
        }

        window.deleteItem = async function (id) {
            const card = document.querySelector(`[data-id="${id}"]`);
            if (card) {
                card.style.animation = "fadeOut 0.3s ease forwards";

                const itemToRemove = windowUserWatchlist.find(x => x.id === id);
                if (itemToRemove) {
                    windowUserHistory.push({
                        id: Date.now(),
                        action: 'Removed from Watchlist',
                        title: itemToRemove.title,
                        image: itemToRemove.image,
                        timestamp: new Date().toISOString()
                    });
                }

                windowUserWatchlist = windowUserWatchlist.filter(x => x.id !== id);

                try {
                    await setDoc(doc(db, "users", currentUser.uid), { watchlist: windowUserWatchlist, history: windowUserHistory }, { merge: true });
                } catch (e) {
                    console.error("Delete Error", e);
                }

                setTimeout(() => {
                    const parentGrid = card.parentElement;
                    card.remove();

                    if (parentGrid.querySelectorAll('.poster-card').length === 0) {
                        parentGrid.innerHTML = '<div class="empty-state">No items yet</div>';
                    }
                    updateCounts();
                }, 300);
            }
        }

        window.updateItem = async function (id, field, value) {
            let itemIndex = windowUserWatchlist.findIndex(x => x.id === id);
            if (itemIndex > -1) {
                const oldVal = windowUserWatchlist[itemIndex][field];
                windowUserWatchlist[itemIndex][field] = value;

                if (field === 'status' && oldVal !== value) {
                    const item = windowUserWatchlist[itemIndex];
                    const formatStatus = (s) => {
                        if (s === 'Watching' || s === 'watching') return 'Watching New';
                        if (s === 'watching-another') return 'Watching Another S/M';
                        if (s === 'plan-to-watch') return 'Plan to Watch';
                        if (s === 'on-hold') return 'On Hold';
                        if (s === 'watched') return 'Watched';
                        return s;
                    };
                    windowUserHistory.push({
                        id: Date.now(),
                        action: `Status: ${formatStatus(value)}`,
                        title: item.title,
                        image: item.image,
                        timestamp: new Date().toISOString()
                    });
                }

                try {
                    await setDoc(doc(db, "users", currentUser.uid), { watchlist: windowUserWatchlist, history: windowUserHistory }, { merge: true });
                    refreshDashboard();
                } catch (e) {
                    console.error("Update Error", e);
                }
            }
        }

        window.deleteFavoriteItem = async function (id) {
            const card = document.querySelector(`[data-favid="${id}"]`);
            if (card) {
                card.style.animation = "fadeOut 0.3s ease forwards";

                const itemToRemove = windowUserFavorites.find(x => x.id === id);
                if (itemToRemove) {
                    windowUserHistory.push({
                        id: Date.now(),
                        action: 'Removed from Favorites',
                        title: itemToRemove.title,
                        image: itemToRemove.image,
                        timestamp: new Date().toISOString()
                    });
                }

                windowUserFavorites = windowUserFavorites.filter(x => x.id !== id);

                try {
                    await setDoc(doc(db, "users", currentUser.uid), { favorites: windowUserFavorites, history: windowUserHistory }, { merge: true });
                } catch (e) {
                    console.error("Delete Error", e);
                }

                setTimeout(() => {
                    const parentGrid = card.parentElement;
                    card.remove();

                    if (parentGrid.querySelectorAll('.poster-card').length === 0) {
                        parentGrid.innerHTML = '<div class="empty-state">No favorites yet</div>';
                    }
                    updateCounts();
                    // also refresh icons on watchlist items
                    document.querySelectorAll('.fav-icon-btn').forEach(btn => {
                        const wrapperCard = btn.closest('.poster-card');
                        if (wrapperCard && wrapperCard.hasAttribute('data-id')) {
                            const wId = parseInt(wrapperCard.getAttribute('data-id'));
                            const item = windowUserWatchlist.find(w => w.id === wId);
                            if (item) {
                                const isStillFav = windowUserFavorites.some(f => f.title === item.title && f.year == item.year);
                                if (!isStillFav) {
                                    btn.classList.remove('active');
                                }
                            }
                        }
                    });
                }, 300);
            }
        }

        window.toggleFavoriteWL = async function (idStr, btnElement) {
            if (!currentUser) {
                window.location.href = "login.html";
                return;
            }
            const id = parseInt(idStr);
            const item = windowUserWatchlist.find(x => x.id === id);
            if (!item) return;

            const existingIndex = windowUserFavorites.findIndex(f => f.title === item.title && f.year == item.year);

            if (existingIndex > -1) {
                // Remove
                windowUserFavorites.splice(existingIndex, 1);
                btnElement.classList.remove('active');
                windowUserHistory.push({
                    id: Date.now(),
                    action: 'Removed from Favorites',
                    title: item.title,
                    image: item.image,
                    timestamp: new Date().toISOString()
                });
            } else {
                // Add
                const favObj = {
                    id: Date.now(),
                    tmdbId: item.tmdbId,
                    mediaType: item.mediaType,
                    title: item.title,
                    image: item.image,
                    year: item.year
                };
                windowUserFavorites.push(favObj);
                btnElement.classList.add('active');
                windowUserHistory.push({
                    id: Date.now(),
                    action: 'Added to Favorites',
                    title: item.title,
                    image: item.image,
                    timestamp: new Date().toISOString()
                });
            }

            try {
                await setDoc(doc(db, "users", currentUser.uid), { favorites: windowUserFavorites, history: windowUserHistory }, { merge: true });
                // Refresh favorites section
                const favContainer = document.getElementById('list-favorites');
                if (favContainer) {
                    favContainer.innerHTML = '<div class="empty-state">No favorites yet</div>';
                    windowUserFavorites.forEach(fav => renderFavoriteItem(fav));
                }
                updateCounts();
            } catch (e) {
                console.error("Toggle Favorite Error", e);
            }
        }

        function refreshDashboard() {
            ['list-favorites', 'list-Watching', 'list-watching-another', 'list-plan-to-watch', 'list-on-hold', 'list-watched'].forEach(listId => {
                const container = document.getElementById(listId);
                if (container) {
                    container.innerHTML = `<div class="empty-state">No ${listId === 'list-favorites' ? 'favorites' : 'items'} yet</div>`;
                }
            });
            loadData();
        }

        window.exportUserData = function() {
            if (!currentUser) return;
            
            const cleanWatchlist = windowUserWatchlist.map(item => ({
                title: item.title,
                type: item.mediaType === 'movie' ? 'Movie' : 'Series',
                year: item.year,
                platform: item.platform,
                status: item.status
            }));

            const cleanFavorites = windowUserFavorites.map(item => ({
                title: item.title,
                type: item.mediaType === 'movie' ? 'Movie' : 'Series',
                year: item.year
            }));
            
            const dataToExport = {
                exportDate: new Date().toISOString().split('T')[0],
                watchlist: cleanWatchlist,
                favorites: cleanFavorites
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "watchlist_export_" + new Date().toISOString().split('T')[0] + ".json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };
    </script>

</body>
